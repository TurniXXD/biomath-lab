name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  server-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run server unit tests
        run: uv run --with pytest pytest -q

  client-playwright:
    needs: server-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install client dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright tests
        run: pnpm test:e2e

  client-build:
    needs: client-playwright
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install client dependencies
        run: pnpm install --frozen-lockfile

      - name: Build client
        run: pnpm build

  publish-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: server-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            context: server
            dockerfile: Dockerfile
          - name: publications-news
            context: services/publications-news
            dockerfile: Dockerfile
          - name: alignment
            context: services/alignment
            dockerfile: Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.context }}
          file: ./${{ matrix.context }}/${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/biomath-lab-${{ matrix.name }}:latest
            ghcr.io/${{ github.repository_owner }}/biomath-lab-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-rpi:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish-images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Connect runner to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.RPI_HOST }}

      - name: Start ssh-agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.RPI_SSH_KEY }}

      - name: Add RPi host key
        env:
          RPI_HOST: ${{ secrets.RPI_HOST }}
          RPI_PORT: ${{ secrets.RPI_SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${RPI_PORT:-22}" "${RPI_HOST}" >> ~/.ssh/known_hosts

      - name: Deploy to Raspberry Pi
        env:
          RPI_HOST: ${{ secrets.RPI_HOST }}
          RPI_PORT: ${{ secrets.RPI_SSH_PORT }}
          RPI_USER: ${{ secrets.RPI_USER }}
        run: |
          SSH_PORT="${RPI_PORT:-22}"
          ssh -p "${SSH_PORT}" "${RPI_USER}@${RPI_HOST}" "mkdir -p /home/admin/biomath-lab/scripts"
          scp -P "${SSH_PORT}" docker-compose.rpi.yml "${RPI_USER}@${RPI_HOST}:/home/admin/biomath-lab/docker-compose.rpi.yml"
          scp -P "${SSH_PORT}" scripts/deploy-rpi.sh "${RPI_USER}@${RPI_HOST}:/home/admin/biomath-lab/scripts/deploy-rpi.sh"
          ssh -p "${SSH_PORT}" "${RPI_USER}@${RPI_HOST}" "chmod +x /home/admin/biomath-lab/scripts/deploy-rpi.sh && cd /home/admin/biomath-lab && ./scripts/deploy-rpi.sh"
