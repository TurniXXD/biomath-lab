[package]
name = "alignment"
version = "0.1.0"
edition = "2021"
description = "A small learning-oriented sequence alignment crate"
license = "MIT"

[dependencies]
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
