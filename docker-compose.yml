services:
  db:
    image: pgvector/pgvector:pg16
    container_name: app-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    ports:
      - "5001:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: app-server
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-app}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./server:/app
    command: ["bash", "-lc", "./scripts/start-dev.sh"]

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: app-web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      API_URL_INTERNAL: http://server:8000
    ports:
      - "3000:3000"
    depends_on:
      - server
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    command: ["bash", "-lc", "npm run dev -- --hostname 0.0.0.0 --port 3000"]

volumes:
  db_data:
  web_node_modules:
