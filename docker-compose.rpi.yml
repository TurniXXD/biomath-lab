services:
  db:
    image: pgvector/pgvector:pg16
    container_name: app-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30

  publications-news:
    image: ghcr.io/${GHCR_OWNER}/biomath-lab-publications-news:${IMAGE_TAG:-latest}
    container_name: app-publications-news
    restart: unless-stopped
    environment:
      PUBLICATIONS_NEWS_OUTPUT_DIR: /app/output
    volumes:
      - publications_news_output:/app/output
    depends_on:
      db:
        condition: service_healthy
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8100"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12

  alignment-api:
    image: ghcr.io/${GHCR_OWNER}/biomath-lab-alignment:${IMAGE_TAG:-latest}
    container_name: app-alignment-api
    restart: unless-stopped
    environment:
      ALIGNMENT_BIND_ADDR: 0.0.0.0:8200
    entrypoint: ["alignment-server"]
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://127.0.0.1:8200/health
      interval: 10s
      timeout: 5s
      retries: 12

  server:
    image: ghcr.io/${GHCR_OWNER}/biomath-lab-server:${IMAGE_TAG:-latest}
    container_name: app-server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-app}
      PUBLICATIONS_NEWS_BASE_URL: http://publications-news:8100
      ALIGNMENT_BASE_URL: http://alignment-api:8200
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      publications-news:
        condition: service_healthy
      alignment-api:
        condition: service_healthy
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

volumes:
  db_data:
  publications_news_output:
